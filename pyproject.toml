[project]
name = "drone-sim-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "drone-sim-artifacts",
    "drone-sim-orchestration",
    "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["orchestration/src", "artifacts/src"]

[tool.uv.workspace]
members = ["artifacts", "orchestration"]

[tool.uv.sources]
drone-sim-artifacts = { workspace = true }
drone-sim-orchestration = { workspace = true }
