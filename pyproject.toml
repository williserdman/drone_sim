[project]
name = "drone-sim-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "drone-sim-ardupilot",
    "drone-sim-artifacts",
    "drone-sim-companion",
    "drone-sim-electromagnet",
    "drone-sim-gazebo",
    "drone-sim-orchestration",
    "drone-sim-scorekeeper",
    "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "numpy==2.1.3",
    "opencv-contrib-python-headless==4.10.0.84",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = [
    "ardupilot_sitl/tests", "artifacts/tests", "companion/tests",
    "companion/comp2026/tests", "electromagnet/tests", "gazebo/tests",
    "orchestration/tests", "scorekeeper/tests", "tests",
]
addopts = ["--import-mode=importlib"]
pythonpath = [
    "orchestration/src",
    "artifacts/src",
    "companion/src",
    "electromagnet/src",
    "gazebo/src",
    "scorekeeper/src",
]

[tool.uv.workspace]
members = ["ardupilot_sitl", "artifacts", "companion", "electromagnet", "gazebo", "orchestration", "scorekeeper"]

[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
ignore_missing_imports = true
mypy_path = ["artifacts/src", "orchestration/src", "companion/src", "gazebo/src", "scorekeeper/src", "electromagnet/src"]
files = [
    "orchestration/src/orchestration/host_config.py",
    "orchestration/src/orchestration/host_integration.py",
    "orchestration/src/orchestration/qgc_publication.py",
    "orchestration/src/orchestration/_adapters/posix_host.py",
    "orchestration/src/orchestration/catalog.py",
    "orchestration/src/orchestration/workstation.py",
    "orchestration/src/orchestration/gcs_bridge.py",
    "orchestration/src/orchestration/local_runtime.py",
    "orchestration/src/orchestration/operator_readiness.py",
    "orchestration/src/orchestration/operator_session.py",
    "orchestration/src/orchestration/console.py",
    "orchestration/src/orchestration/console_client.py",
    "orchestration/src/orchestration/cli.py",
]

[tool.uv.sources]
drone-sim-ardupilot = { workspace = true }
drone-sim-artifacts = { workspace = true }
drone-sim-companion = { workspace = true }
drone-sim-electromagnet = { workspace = true }
drone-sim-gazebo = { workspace = true }
drone-sim-orchestration = { workspace = true }
drone-sim-scorekeeper = { workspace = true }
