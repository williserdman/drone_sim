[project]
name = "drone-sim-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "drone-sim-ardupilot",
    "drone-sim-artifacts",
    "drone-sim-companion",
    "drone-sim-electromagnet",
    "drone-sim-gazebo",
    "drone-sim-orchestration",
    "drone-sim-scorekeeper",
    "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = [
    "numpy==2.1.3",
    "opencv-contrib-python-headless==4.10.0.84",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = [
    "orchestration/src",
    "artifacts/src",
    "companion/src",
    "electromagnet/src",
    "gazebo/src",
    "scorekeeper/src",
]

[tool.uv.workspace]
members = ["ardupilot_sitl", "artifacts", "companion", "electromagnet", "gazebo", "orchestration", "scorekeeper"]

[tool.uv.sources]
drone-sim-ardupilot = { workspace = true }
drone-sim-artifacts = { workspace = true }
drone-sim-companion = { workspace = true }
drone-sim-electromagnet = { workspace = true }
drone-sim-gazebo = { workspace = true }
drone-sim-orchestration = { workspace = true }
drone-sim-scorekeeper = { workspace = true }
