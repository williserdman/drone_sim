[project]
name = "drone-sim-orchestration"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "drone-sim-artifacts",
    "PyYAML>=6.0,<7",
]

[project.scripts]
drone-sim = "orchestration.cli:main"

[tool.uv.sources]
drone-sim-artifacts = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
