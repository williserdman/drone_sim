services:
  # One isolated network stack for the single-job Vast VM experiment.
  # Service names resolve to this namespace's own IP and use a local route.
  # Fast DDS detects one host here, so its shared-memory IPC must also be shared.
  companion-runtime:
    network_mode: service:gazebo-runtime
    ipc: service:gazebo-runtime
  ardupilot-sitl:
    network_mode: service:gazebo-runtime
    ipc: service:gazebo-runtime
    # Docker forbids expose declarations when joining a container namespace.
    expose: !reset []
  electromagnet-runtime:
    network_mode: service:gazebo-runtime
    ipc: service:gazebo-runtime
  orchestration-runtime:
    network_mode: service:gazebo-runtime
    ipc: service:gazebo-runtime
  scorekeeper-runtime:
    network_mode: service:gazebo-runtime
    ipc: service:gazebo-runtime
  artifacts-runtime:
    network_mode: service:gazebo-runtime
    ipc: service:gazebo-runtime
    devices:
      - /dev/nvidia-caps/nvidia-cap2:/dev/nvidia-caps/nvidia-cap2
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      SIM_VIDEO_ENCODER: h264_nvenc
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  gazebo-runtime:
    ipc: shareable
    networks:
      default:
        aliases:
          - ardupilot-sitl
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
    volumes:
      - ./gazebo/config/10_nvidia.json:/usr/share/glvnd/egl_vendor.d/10_nvidia.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
