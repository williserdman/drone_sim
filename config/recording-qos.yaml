/clock: &clock_qos
  history: keep_last
  depth: 1
  reliability: best_effort
  durability: volatile
/simulation/run_state: &latched_state_qos
  history: keep_last
  depth: 1
  reliability: reliable
  durability: transient_local
/simulation/artifact_status: *latched_state_qos
/simulation/ground_truth:
  history: keep_last
  depth: 10
  reliability: best_effort
  durability: volatile
/simulation/scenario_events: &event_qos
  history: keep_last
  depth: 100
  reliability: reliable
  durability: volatile
/simulation/score_events: *event_qos
/simulation/payload_state:
  history: keep_last
  depth: 100
  reliability: reliable
  durability: volatile
/simulation/payload_events: &competition_event_qos
  history: keep_last
  depth: 100
  reliability: reliable
  durability: transient_local
/simulation/mission_events: *competition_event_qos
/competition/range/downward:
  history: keep_last
  depth: 100
  reliability: reliable
  durability: volatile
/camera/onboard/frame_metadata: &metadata_qos
  history: keep_last
  depth: 100
  reliability: reliable
  durability: volatile
/camera/observer/frame_metadata: *metadata_qos
