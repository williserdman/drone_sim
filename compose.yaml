x-runtime-defaults: &runtime-defaults
  init: true
  restart: "no"
  volumes:
    - type: bind
      source: ${SIM_RUN_DIRECTORY:-/tmp/drone-sim/runs/00000000-0000-4000-8000-000000000001}
      target: ${SIM_RUN_DIRECTORY:-/tmp/drone-sim/runs/00000000-0000-4000-8000-000000000001}
      read_only: false
    - type: bind
      source: ${SIM_CONFIG_PATH:-/tmp/drone-sim/runs/00000000-0000-4000-8000-000000000001/configuration/run.json}
      target: ${SIM_CONFIG_PATH:-/tmp/drone-sim/runs/00000000-0000-4000-8000-000000000001/configuration/run.json}
      read_only: true

x-run-environment: &run-environment
    SIM_RUN_ID: ${SIM_RUN_ID:-00000000-0000-4000-8000-000000000001}
    SIM_RUN_DIRECTORY: ${SIM_RUN_DIRECTORY:-/tmp/drone-sim/runs/00000000-0000-4000-8000-000000000001}
    SIM_CONFIG_PATH: ${SIM_CONFIG_PATH:-/tmp/drone-sim/runs/00000000-0000-4000-8000-000000000001/configuration/run.json}

x-phase2-environment: &phase2-environment
    <<: *run-environment
    SIM_PHASE2_FAULT: ${SIM_PHASE2_FAULT:-}
    SIM_SYNTHETIC_WALL_DELAY_MS: ${SIM_SYNTHETIC_WALL_DELAY_MS:-0}
    SIM_SYNTHETIC_QUIESCENCE_DELAY_MS: ${SIM_SYNTHETIC_QUIESCENCE_DELAY_MS:-0}
services:
  foundation:
    profiles: [foundation]
    init: true
    image: drone-sim-foundation:phase1
    build:
      context: .
      dockerfile: tests/foundation/Dockerfile
    environment:
      SIM_RUN_ID: ${SIM_RUN_ID:-00000000-0000-4000-8000-000000000001}
      SIM_OUTPUT_ROOT: ${SIM_OUTPUT_ROOT:-/output}

  orchestration-runtime:
    <<: *runtime-defaults
    profiles: [phase2, phase3]
    image: drone-sim-orchestration-runtime:phase2
    build:
      context: .
      dockerfile: orchestration/Dockerfile
      target: runtime
    environment:
      <<: *phase2-environment
      SIM_MODULE: orchestration
    command: ["python3", "-m", "orchestration.runtime_node"]

  artifacts-runtime:
    <<: *runtime-defaults
    profiles: [phase2, phase3]
    image: drone-sim-artifacts-runtime:phase2
    build:
      context: .
      dockerfile: artifacts/Dockerfile
      target: runtime
    environment:
      <<: *phase2-environment
      SIM_MODULE: artifacts
    command: ["python3", "-m", "artifacts.runtime_node"]

  synthetic-companion:
    <<: *runtime-defaults
    profiles: [phase2]
    image: drone-sim-synthetic-companion:phase2
    build:
      context: .
      dockerfile: tests/phase2/Dockerfile
      target: runtime
    environment:
      <<: *phase2-environment
      SIM_MODULE: companion
    command: ["python3", "/opt/drone_sim/phase2/module_stub.py", "companion"]

  companion-runtime:
    <<: *runtime-defaults
    profiles: [phase3]
    image: drone-sim-companion-runtime:phase3
    depends_on:
      ardupilot-sitl:
        condition: service_started
        required: true
    build:
      context: .
      dockerfile: companion/Dockerfile
      target: runtime
      args:
        SIM_COMP2026_REVISION: ${SIM_COMP2026_REVISION:-2241d00444db6414a5a1c646c8971c84943849a8}
    environment:
      <<: *run-environment
      SIM_MODULE: companion
      SIM_MAVLINK_ENDPOINT: tcp:ardupilot-sitl:5760
    command: ["drone-sim-companion-runtime"]

  synthetic-ardupilot-sitl:
    <<: *runtime-defaults
    profiles: [phase2]
    image: drone-sim-synthetic-ardupilot-sitl:phase2
    build:
      context: .
      dockerfile: tests/phase2/Dockerfile
      target: runtime
    environment:
      <<: *phase2-environment
      SIM_MODULE: ardupilot_sitl
    command: ["python3", "/opt/drone_sim/phase2/module_stub.py", "ardupilot_sitl"]

  ardupilot-sitl:
    <<: *runtime-defaults
    profiles: [phase3]
    image: drone-sim-ardupilot-runtime:phase3
    depends_on:
      gazebo-runtime:
        condition: service_started
    build:
      context: .
      dockerfile: ardupilot_sitl/Dockerfile
      target: runtime
    environment:
      <<: *run-environment
      SIM_MODULE: ardupilot_sitl
      SIM_GAZEBO_HOST: gazebo-runtime
      SIM_LAUNCH_ORIGIN_JSON: ${SIM_LAUNCH_ORIGIN_JSON:-}
    expose:
      - "5760/tcp"
      - "9003/udp"

  synthetic-gazebo:
    <<: *runtime-defaults
    profiles: [phase2]
    image: drone-sim-synthetic-gazebo:phase2
    build:
      context: .
      dockerfile: tests/phase2/Dockerfile
      target: runtime
    environment:
      <<: *phase2-environment
      SIM_MODULE: gazebo
    command: ["python3", "/opt/drone_sim/phase2/synthetic_gazebo.py"]

  gazebo-runtime:
    <<: *runtime-defaults
    profiles: [phase3]
    image: drone-sim-gazebo-runtime:phase3
    build:
      context: .
      dockerfile: gazebo/Dockerfile
      target: runtime
    environment:
      <<: *run-environment
      SIM_MODULE: gazebo
    expose:
      - "9002/udp"
    command: ["drone-sim-gazebo-runtime"]

  synthetic-electromagnet:
    <<: *runtime-defaults
    profiles: [phase2]
    image: drone-sim-synthetic-electromagnet:phase2
    build:
      context: .
      dockerfile: tests/phase2/Dockerfile
      target: runtime
    environment:
      <<: *phase2-environment
      SIM_MODULE: electromagnet
    command: ["python3", "/opt/drone_sim/phase2/synthetic_electromagnet.py"]

  electromagnet-runtime:
    <<: *runtime-defaults
    profiles: [phase3]
    image: drone-sim-electromagnet-runtime:phase3
    build:
      context: .
      dockerfile: electromagnet/Dockerfile
      target: runtime
    environment:
      <<: *run-environment
      SIM_MODULE: electromagnet
    command: ["drone-sim-electromagnet-runtime"]

  synthetic-scorekeeper:
    <<: *runtime-defaults
    profiles: [phase2]
    image: drone-sim-synthetic-scorekeeper:phase2
    build:
      context: .
      dockerfile: tests/phase2/Dockerfile
      target: runtime
    environment:
      <<: *phase2-environment
      SIM_MODULE: scorekeeper
    command: ["python3", "/opt/drone_sim/phase2/synthetic_scorekeeper.py"]

  scorekeeper-runtime:
    <<: *runtime-defaults
    profiles: [phase3]
    image: drone-sim-scorekeeper-runtime:phase3
    build:
      context: .
      dockerfile: scorekeeper/Dockerfile
      target: runtime
    environment:
      <<: *run-environment
      SIM_MODULE: scorekeeper
    command: ["drone-sim-scorekeeper-runtime"]
