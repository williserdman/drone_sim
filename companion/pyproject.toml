[project]
name = "drone-sim-companion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "drone-sim-artifacts==0.1.0",
    "fastcrc==0.3.6",
    "pymavlink==2.4.49",
]

[project.scripts]
drone-sim-companion-runtime = "drone_sim_companion.runtime_node:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
