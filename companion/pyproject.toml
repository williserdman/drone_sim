[project]
name = "drone-sim-companion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "drone-sim-artifacts==0.1.0",
    "dronekit==2.9.2",
    "fastcrc==0.3.6",
    "future==1.0.0",
    "numpy==2.1.3",
    "opencv-contrib-python-headless==4.10.0.84",
    "pymavlink==2.4.49",
    "PyYAML==6.0.3",
]

[project.scripts]
drone-sim-companion-runtime = "drone_sim_companion.runtime_node:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
drone_sim_companion = ["gazebo_camera_calibration.json"]
